# Pointer settings for every machine, linked to
# ~/.config/fanshell-qs/mouse.defaults.conf by tools/link-config.
#
# SETTING:NAME=VALUE, where NAME is any part of the device's name (as
# `xinput list` shows it), matched ignoring case; the last matching line
# wins. The Mouse & touchpad popup saves its own choices to mouse.conf by
# the exact name, and those win over these. Settings (see shell/mouse.h):
#
#   speed        -1.00 .. 1.00 (libinput Accel Speed; 0 is the default)
#   accel        adaptive, flat
#   natural      on, off        natural (reversed) scrolling
#   left_handed  on, off
#   tap          on, off        touchpads: tap to click
#   dwt          on, off        touchpads: disable while typing
#   scroll       two-finger, edge   touchpads

speed:epic mouse=-0.5
speed:harpe ace=-0.2
speed:g pro=-0.5
