backend = "glx";
vsync = true;
use-damage = true;
unredir-if-fullscreen = true;

# no shadows on bspwm/dwm/i3-managed windows where they're often wrong
shadow = false;
fading = false;

# Blur only behind the shell's notification toasts (the rules below). The
# method mirrors Hyprland's decoration.blur (size 3, passes 2).
#
# Setting a method here turns background blur on for every window with
# transparency, whatever blur-background says (picom v13): browsers' menus,
# drawn in oversized transparent windows, got a blurred halo far outside
# them, and 80% terminals were blurred too. So the first rule turns it off
# for everything, and later rules turn it back on where wanted.
blur-background = false;
blur: {
  method = "dual_kawase";
  strength = 4;
};

# Window rules replace the old wintypes block (which only disabled shadows on
# desktop and dock windows -- already covered by shadow = false above). They
# apply in order, and the last one to set an option wins.
rules = (
  # No blur unless a rule below asks for it.
  { blur-background = false; },

  # fanshell-qs notification toasts (Hyprland: layer_rule blur for
  # fanhypr-qs-notifications). The shell shapes this window to its cards, so
  # only the cards are blurred.
  { match = "name = 'fanshell-qs-notifications'"; blur-background = true; },
);
