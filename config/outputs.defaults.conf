# Default output layouts, used when ~/.config/fanshell-qs/outputs.conf has
# none for the outputs connected now. These carry over what
# ~/.local/bin/monitor-config.sh did; saving from the Displays popup writes
# outputs.conf, which then takes precedence. Format: see fanshell-qs-outputs.

# Desktop: two 100 Hz panels side by side, the right one primary.
[DisplayPort-0+DisplayPort-1]
DisplayPort-0 mode=1920x1080 rate=100.00 pos=0x0 rotate=normal
DisplayPort-1 mode=1920x1080 rate=100.00 pos=1920x0 rotate=normal primary

# Laptop panel on its own.
[eDP-1]
eDP-1 mode=auto pos=0x0 rotate=normal primary
