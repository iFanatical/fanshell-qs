# ~/.config/xdg-desktop-portal/portals.conf — which portal backend answers,
# for every session. Neither qtile nor oxwm (XDG_CURRENT_DESKTOP) matches a
# backend of its own, and the portal falls back to this file when there is
# no <desktop>-portals.conf; on OpenRC it runs as a user service, without the
# session's XDG_CURRENT_DESKTOP, and always reads this one.

[preferred]
default=gtk
